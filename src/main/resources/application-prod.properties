# Perfil de producao (Portal de Deploy DB1), ativado pelo Dockerfile.
# O portal injeta SPRING_DATASOURCE_* e SPRING_FLYWAY_* apontando para um PostgreSQL.

# As migrations do MySQL usam sintaxe que o PostgreSQL nao aceita (auto_increment, tinyint)
spring.flyway.locations=classpath:db/postgresql

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# O portal conecta pelo PgBouncer em modo transacao, que nao convive com
# prepared statements do lado do servidor
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# O app roda atras do proxy HTTPS do portal: sem isto, o Swagger monta os links
# com http:// e o navegador bloqueia as chamadas do "Try it out"
server.forward-headers-strategy=framework
